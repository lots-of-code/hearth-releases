<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-title" content="Shopping">
<meta name="theme-color" content="#33473B">
<title>Shopping list · Hearth</title>
<!--
  Hearth's "Send to phone" page. The list arrives after the "#" in the link (which
  browsers never send to a server), is kept on the phone in localStorage, and the
  page itself is cached by sw.js so it opens in the store with no signal.
  Source: hearth/phone/list — publish with `npm run publish-phone`.
-->
<style>
  :root{
    --paper:#F5F3EA; --raised:#FFFFFE; --ink:#262820; --soft:#63644F; --faint:#94947E;
    --forest:#33473B; --sage-pale:#DEE5D2; --line:#DCD6C2; --clay:#A85B41;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#1E2119; --raised:#262A21; --ink:#ECEBE0; --soft:#B5B4A0; --faint:#85846F;
      --forest:#9DB894; --sage-pale:#2F3A2C; --line:#3A3F33; --clay:#E0957A; color-scheme: dark; }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--paper);color:var(--ink);}
  body{font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px calc(32px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;}
  header{position:sticky;top:0;background:var(--paper);padding:calc(16px + env(safe-area-inset-top)) 0 12px;border-bottom:1px solid var(--line);z-index:1;}
  h1{font:600 24px/1.2 Georgia,"Times New Roman",serif;margin:0;color:var(--forest);}
  .meta{display:flex;justify-content:space-between;gap:12px;margin-top:4px;color:var(--soft);font-size:14px;}
  .left{font-weight:600;color:var(--ink);}
  main{max-width:560px;margin:0 auto;}
  h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:22px 0 6px;}
  ul{list-style:none;margin:0;padding:0;background:var(--raised);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  li+li{border-top:1px solid var(--line);}
  button.item{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:12px 16px;cursor:pointer;}
  .box{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;}
  .box svg{width:16px;height:16px;opacity:0;}
  .item[aria-checked="true"] .box{background:var(--forest);border-color:var(--forest);}
  .item[aria-checked="true"] .box svg{opacity:1;}
  .item[aria-checked="true"] .text{text-decoration:line-through;color:var(--faint);}
  .text{overflow-wrap:anywhere;}
  .done-banner{margin-top:20px;padding:14px 16px;border-radius:12px;background:var(--sage-pale);color:var(--ink);text-align:center;font-weight:600;}
  .message{margin-top:40px;text-align:center;color:var(--soft);}
  .message strong{display:block;color:var(--ink);font-size:19px;margin-bottom:6px;}
  footer{margin-top:28px;color:var(--faint);font-size:13px;text-align:center;}
  [hidden]{display:none !important;}
</style>
</head>
<body>
<main>
  <header>
    <h1>Shopping list</h1>
    <div class="meta"><span id="from"></span><span class="left" id="left"></span></div>
  </header>
  <div id="list"></div>
  <div class="done-banner" id="done" hidden>Everything's in the cart. Well done!</div>
  <div class="message" id="message" hidden></div>
  <footer id="footer" hidden>Tap an item to tick it off. This list stays on your phone, even with no signal. Scan a new code in Hearth to replace it.</footer>
</main>
<script>
(function () {
  "use strict";
  var STORE = "hearth-shopping-list";
  var $ = function (id) { return document.getElementById(id); };
  var TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function load() { try { return JSON.parse(localStorage.getItem(STORE)); } catch (e) { return null; } }
  function save(state) { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

  function showMessage(title, text) {
    $("message").hidden = false;
    $("message").textContent = "";
    var s = document.createElement("strong");
    s.textContent = title;
    $("message").appendChild(s);
    $("message").appendChild(document.createTextNode(text));
  }

  // "#1" + base64url(deflate-raw(JSON)) — see hearth/src/phoneList.js
  async function decode(hash) {
    if (hash.charAt(0) !== "1") throw new Error("unknown version");
    var b64 = hash.slice(1).replace(/-/g, "+").replace(/_/g, "/");
    var bin = atob(b64 + "===".slice((b64.length + 3) % 4));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    var list = JSON.parse(await new Response(stream).text());
    if (!list || !Array.isArray(list.c)) throw new Error("bad list");
    return list;
  }

  function fmtDate(iso) {
    var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    if (!p) return "";
    var d = new Date(+p[1], +p[2] - 1, +p[3]);
    return "From Hearth · " + d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }

  function render(state) {
    var list = state.list, ticked = state.ticked || {}, total = 0, got = 0;
    var root = $("list");
    root.textContent = "";
    list.c.forEach(function (group, g) {
      var h = document.createElement("h2");
      h.textContent = group[0];
      var ul = document.createElement("ul");
      group[1].forEach(function (text, i) {
        var id = g + ":" + i;
        total++;
        if (ticked[id]) got++;
        var li = document.createElement("li");
        var b = document.createElement("button");
        b.type = "button";
        b.className = "item";
        b.setAttribute("role", "checkbox");
        b.setAttribute("aria-checked", ticked[id] ? "true" : "false");
        b.innerHTML = '<span class="box">' + TICK + '</span><span class="text"></span>';
        b.querySelector(".text").textContent = text;
        b.addEventListener("click", function () {
          if (ticked[id]) delete ticked[id]; else ticked[id] = true;
          state.ticked = ticked;
          save(state);
          render(state);
        });
        li.appendChild(b);
        ul.appendChild(li);
      });
      root.appendChild(h);
      root.appendChild(ul);
    });
    $("from").textContent = fmtDate(list.d);
    $("left").textContent = total - got ? (total - got) + " to get" : "";
    $("done").hidden = !(total && got === total);
    $("footer").hidden = false;
  }

  async function start() {
    var hash = location.hash.slice(1);
    var state = load();
    if (hash) {
      try {
        var list = await decode(hash);
        // Scanning the same code again keeps the ticks; a new code replaces the list.
        if (!state || state.key !== hash) state = { key: hash, list: list, ticked: {} };
        save(state);
      } catch (e) {
        if (typeof DecompressionStream === "undefined") {
          showMessage("This phone's browser is too old", "Update your phone's software, then scan the code in Hearth again.");
        } else {
          showMessage("That link didn't come through whole", "Go back to Hearth and scan the code again.");
        }
        return;
      }
      // Drop the list from the address bar, so a home-screen shortcut always opens the latest list.
      try { history.replaceState(null, "", location.pathname); } catch (e) {}
    }
    if (state && state.list) render(state);
    else showMessage("No list here yet", "In Hearth, open Shopping list and choose Send to phone, then point your camera at the code.");
  }

  start();
  window.addEventListener("hashchange", function () { $("message").hidden = true; start(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>
